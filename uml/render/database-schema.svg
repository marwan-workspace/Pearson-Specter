<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 940" role="img" aria-labelledby="title desc">
  <title id="title">Pearson Specter backend database overview</title>
  <desc id="desc">PostgreSQL entities for mission access, health records, decisions, medication inventory, and Earth reports.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7193bd"/></marker>
    <style>
      .bg{fill:#081522}.card{fill:#102438;stroke:#37516d;stroke-width:2}.head{fill:#173550}.title{font:700 20px system-ui,sans-serif;fill:#f2f6fa}.body{font:15px system-ui,sans-serif;fill:#b8c8d8}.sub{font:13px system-ui,sans-serif;fill:#8fa9c2}.line{fill:none;stroke:#7193bd;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1500" height="940" rx="24"/>
  <text x="48" y="54" class="title" style="font-size:27px">Pearson Specter · PostgreSQL schema</text>
  <text x="48" y="82" class="sub">RLS separates personal records, decider access, acting-leader views, and addressed crew alerts.</text>
  <path class="line" d="M325 245H390"/><path class="line" d="M660 245H720"/><path class="line" d="M1000 245H1060"/>
  <path class="line" d="M190 370V510"/><path class="line" d="M520 370V510"/><path class="line" d="M860 370V510"/><path class="line" d="M1200 370V510"/>
  <path class="line" d="M325 650H390"/><path class="line" d="M660 650H720"/><path class="line" d="M1000 650H1060"/>
  <g transform="translate(48 120)"><rect class="card" width="277" height="250" rx="14"/><path class="head" d="M62 0H263a14 14 0 0 1 14 14v42H0V14A14 14 0 0 1 14 0z"/><text x="18" y="36" class="title">Mission &amp; access</text><text x="18" y="88" class="body">missions · location and Earth link</text><text x="18" y="116" class="body">astronauts · command rank and fitness</text><text x="18" y="144" class="body">accounts · PIN hash and lock state</text><text x="18" y="172" class="body">sessions · hashed token and expiry</text><text x="18" y="200" class="body">command_handovers · audit trail</text><text x="18" y="229" class="sub">Authority comes from current chain.</text></g>
  <g transform="translate(390 120)"><rect class="card" width="270" height="250" rx="14"/><path class="head" d="M62 0H256a14 14 0 0 1 14 14v42H0V14A14 14 0 0 1 14 0z"/><text x="18" y="36" class="title">Crew health records</text><text x="18" y="88" class="body">vital_samples</text><text x="18" y="116" class="body">sleep_sessions · sleep_stages</text><text x="18" y="144" class="body">check_ins · check_in_answers</text><text x="18" y="172" class="body">lab_results</text><text x="18" y="200" class="body">condition_events</text><text x="18" y="229" class="sub">Self and decider can read.</text></g>
  <g transform="translate(720 120)"><rect class="card" width="280" height="250" rx="14"/><path class="head" d="M62 0H266a14 14 0 0 1 14 14v42H0V14A14 14 0 0 1 14 0z"/><text x="18" y="36" class="title">Agent &amp; decisions</text><text x="18" y="88" class="body">agent_conversations · agent_messages</text><text x="18" y="116" class="body">health_assessments</text><text x="18" y="144" class="body">treatment_plans · items</text><text x="18" y="172" class="body">decisions · escalation and actor</text><text x="18" y="200" class="body">rule_sets · rules</text><text x="18" y="229" class="sub">Chat text stays owner-only.</text></g>
  <g transform="translate(1060 120)"><rect class="card" width="390" height="250" rx="14"/><path class="head" d="M62 0H376a14 14 0 0 1 14 14v42H0V14A14 14 0 0 1 14 0z"/><text x="18" y="36" class="title">Medication &amp; crew response</text><text x="18" y="88" class="body">medications · medication_inventory</text><text x="18" y="116" class="body">medication_events · dose and status</text><text x="18" y="144" class="body">crew_alerts · recipient-scoped</text><text x="18" y="172" class="body">Administration consumes matching stock.</text><text x="18" y="200" class="body">Reviewed quantity and stock are required.</text><text x="18" y="229" class="sub">No demo inventory is seeded.</text></g>
  <g transform="translate(48 510)"><rect class="card" width="277" height="280" rx="14"/><path class="head" d="M62 0H263a14 14 0 0 1 14 14v42H0V14A14 14 0 0 1 14 0z"/><text x="18" y="36" class="title">Mission data</text><text x="18" y="90" class="body">One mission owns crew and settings.</text><text x="18" y="120" class="body">Destination sets round-trip delay.</text><text x="18" y="150" class="body">Earth link can queue reports.</text><text x="18" y="180" class="body">Review interval is configurable.</text><text x="18" y="230" class="sub">ISS · Moon · Mars demo values</text></g>
  <g transform="translate(390 510)"><rect class="card" width="270" height="280" rx="14"/><path class="head" d="M62 0H256a14 14 0 0 1 14 14v42H0V14A14 14 0 0 1 14 0z"/><text x="18" y="36" class="title">Astronaut data</text><text x="18" y="90" class="body">Timestamps drive incremental reads.</text><text x="18" y="120" class="body">Each table carries astronaut_id.</text><text x="18" y="150" class="body">RLS filters rows in SQL.</text><text x="18" y="180" class="body">Crew sees only addressed alerts.</text><text x="18" y="230" class="sub">Stored transcript and scores.</text></g>
  <g transform="translate(720 510)"><rect class="card" width="280" height="280" rx="14"/><path class="head" d="M62 0H266a14 14 0 0 1 14 14v42H0V14A14 14 0 0 1 14 0z"/><text x="18" y="36" class="title">On-board approvals</text><text x="18" y="90" class="body">Plans go to the astronaut's decider.</text><text x="18" y="120" class="body">Timed decisions move one rank down.</text><text x="18" y="150" class="body">Compare-and-set prevents double action.</text><text x="18" y="180" class="body">Earth replies do not approve plans.</text><text x="18" y="230" class="sub">Each outcome is auditable.</text></g>
  <g transform="translate(1060 510)"><rect class="card" width="390" height="280" rx="14"/><path class="head" d="M62 0H376a14 14 0 0 1 14 14v42H0V14A14 14 0 0 1 14 0z"/><text x="18" y="36" class="title">Reports to mission command</text><text x="18" y="90" class="body">mission_reports · weekly and emergency</text><text x="18" y="120" class="body">sent_at · arrives_at · reply_due_at</text><text x="18" y="150" class="body">mission_command_replies</text><text x="18" y="180" class="body">Queue offline, dispatch on reconnection.</text><text x="18" y="210" class="body">Worker records simulated acknowledgment.</text><text x="18" y="250" class="sub">No external Earth integration.</text></g>
  <text x="48" y="875" class="sub">Schema source: database/schema.sql · Detail model: uml/database-schema.mmd</text>
</svg>
